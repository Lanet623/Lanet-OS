# Lanet Shell integration
exec dbus-update-activation-environment WAYLAND_DISPLAY DISPLAY
exec lanet-shell

for_window [title="Lanet OS Shell"] fullscreen enable
for_window [title="Lanet OS Shell"] border none
bindsym Mod4+d exec lanet-shell
bindsym Mod4+i exec lanet-settings
bindsym Mod4+Return exec xfce4-terminal
bindsym Mod4+Escape exec swaymsg exit

default_border none
focus_follows_mouse yes

seat * hide_cursor 5000
